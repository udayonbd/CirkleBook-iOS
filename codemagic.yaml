workflows:
  cirklebook-ios:
    name: Cirklebook iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 24

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Build iOS
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build